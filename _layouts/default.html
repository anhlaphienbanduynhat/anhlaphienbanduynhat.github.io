<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Typography: Inter Variable & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  
  <!-- Minimalist Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">

  {% seo %}

  <!-- i18n Global Dictionary -->
  <script>
    window.SITE_I18N = {{ site.data.i18n | jsonify }};
    window.CURRENT_LANG = localStorage.getItem('quiztide_lang') || 'pt';

    window.setLanguage = function(lang) {
      window.CURRENT_LANG = lang;
      localStorage.setItem('quiztide_lang', lang);
      document.documentElement.lang = lang;

      var flagImg = document.getElementById('current-flag-img');
      var langName = document.getElementById('current-lang-name');
      var flagMap = {
        pt: { flag: '{{ "/assets/images/flags/br.svg" | relative_url }}', name: 'Português' },
        en: { flag: '{{ "/assets/images/flags/us.svg" | relative_url }}', name: 'English' },
        es: { flag: '{{ "/assets/images/flags/es.svg" | relative_url }}', name: 'Español' }
      };
      if (flagImg && flagMap[lang]) flagImg.src = flagMap[lang].flag;
      if (langName && flagMap[lang]) langName.textContent = flagMap[lang].name;

      var dropdown = document.getElementById('lang-dropdown');
      if (dropdown) dropdown.removeAttribute('open');

      window.dispatchEvent(new CustomEvent('quiztide:langchange', { detail: { lang: lang } }));
    };
  </script>
</head>
<body class="site-body">
  {% include header.html %}

  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      window.setLanguage(window.CURRENT_LANG);

      // Close dropdown when clicking outside
      document.addEventListener('click', function(e) {
        var dropdown = document.getElementById('lang-dropdown');
        if (dropdown && dropdown.hasAttribute('open') && !dropdown.contains(e.target)) {
          dropdown.removeAttribute('open');
        }
      });
    });
  </script>
</body>
</html>

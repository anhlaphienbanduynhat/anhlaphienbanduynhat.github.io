<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">

  {% seo %}

  <!-- Global i18n Dictionary from _data/i18n.yml -->
  <script>
    window.SITE_I18N = {{ site.data.i18n | jsonify }};
    window.CURRENT_LANG = localStorage.getItem('quiztide_lang') || 'pt';

    window.setLanguage = function(lang) {
      window.CURRENT_LANG = lang;
      localStorage.setItem('quiztide_lang', lang);
      document.documentElement.lang = lang;

      // Update button active states
      document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      // Update global nav texts
      var t = window.SITE_I18N[lang] || window.SITE_I18N.pt;
      var navHome = document.getElementById('nav-link-home');
      var navAbout = document.getElementById('nav-link-about');
      if (navHome) navHome.textContent = t.nav_home;
      if (navAbout) navAbout.textContent = t.nav_about;

      // Dispatch event for active page (home or quiz)
      window.dispatchEvent(new CustomEvent('quiztide:langchange', { detail: { lang: lang } }));
    };
  </script>
</head>
<body>
  {% include header.html %}

  <!-- Top Ad Slot (AdSense Ready) -->
  <div class="container ad-container ad-top">
    <div class="ad-placeholder"><span>Advertisement</span></div>
  </div>

  <!-- Main Page Content -->
  <main class="main-content">
    {{ content }}
  </main>

  <!-- Bottom Ad Slot (AdSense Ready) -->
  <div class="container ad-container ad-bottom">
    <div class="ad-placeholder"><span>Advertisement</span></div>
  </div>

  {% include footer.html %}

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      window.setLanguage(window.CURRENT_LANG);
    });
  </script>
</body>
</html>

---
layout: default
---

<article class="quiz-article container">
  <!-- Breadcrumb & Navigation -->
  <div class="quiz-top-nav">
    <a href="{{ '/' | relative_url }}" class="quiz-back-link" id="quiz-back-link">← Todos os testes</a>
    <div class="quiz-meta-pills">
      <span class="quiz-meta-pill" id="quiz-category-pill">Personalidade</span>
      <span class="quiz-meta-pill tabular-nums" id="quiz-time-pill">⏱ ~2 min</span>
    </div>
  </div>

  <!-- Quiz Hero Banner -->
  <header class="quiz-header">
    <div class="quiz-cover-wrapper" id="quiz-cover-wrapper" style="display: none;">
      <img src="" alt="Quiz Banner" class="quiz-cover-img" id="quiz-cover-img">
    </div>

    <h1 class="quiz-title" id="quiz-title">Carregando...</h1>
    <p class="quiz-subtitle" id="quiz-subtitle"></p>

    <!-- Language Notice (if quiz not available in selected lang) -->
    <div id="quiz-lang-notice" class="quiz-lang-notice" style="display: none;" role="alert"></div>
  </header>

  <!-- Quiz Interactive Stage -->
  <div id="quiz-stage" class="quiz-stage">
    <!-- Progress Header -->
    <div class="quiz-stepper-header">
      <div class="stepper-meta">
        <span class="stepper-step" id="quiz-progress-text">Questão 01 de 06</span>
        <span class="stepper-pct tabular-nums" id="quiz-progress-percent">0%</span>
      </div>
      <div class="quiz-progress-track" role="progressbar" id="quiz-progress-bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="quiz-progress-fill" class="quiz-progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Active Question Card -->
    <div id="quiz-question-card" class="quiz-question-card">
      <div id="quiz-question-img-wrapper" class="quiz-question-img-wrapper" style="display: none;">
        <img id="quiz-question-img" src="" alt="Question visual" class="quiz-question-img">
      </div>
      
      <div class="question-title-wrap">
        <span class="question-eyebrow" id="question-eyebrow">QUESTÃO</span>
        <h2 id="quiz-question-title" class="question-title"></h2>
      </div>

      <!-- Keyboard shortcuts hint -->
      <div class="keyboard-tip-bar" id="keyboard-tip-bar">
        <span>Dica: pressione as teclas</span>
        <kbd class="kbd-key">A</kbd>
        <kbd class="kbd-key">B</kbd>
        <kbd class="kbd-key">C</kbd>
        <kbd class="kbd-key">D</kbd>
        <span>no teclado</span>
      </div>

      <!-- Options container -->
      <div id="quiz-options-list" class="options-container" role="group" aria-label="Opções da questão"></div>
    </div>

    <!-- Quiz Result Screen (Initially Hidden) -->
    <div id="quiz-result-card" class="quiz-result-card" style="display: none;" role="region" aria-live="polite">
      <div class="result-header-badge">
        <span class="result-pulse-dot"></span>
        <span id="result-celebration">Perfil Psicológico Revelado</span>
      </div>
      
      <div id="result-img-wrapper" class="result-img-wrapper" style="display: none;">
        <img id="result-img" src="" alt="Resultado" class="result-img">
      </div>

      <div id="result-badge" class="result-badge" aria-hidden="true">🌊</div>
      <h2 id="result-title" class="result-title"></h2>
      <p id="result-description" class="result-description"></p>

      <!-- Trait Breakdown Visualization -->
      <div class="trait-breakdown-box">
        <h3 class="trait-breakdown-title" id="trait-breakdown-title">Distribuição dos Seus Traços</h3>
        <div id="trait-bars-container" class="trait-bars-container"></div>
      </div>

      <!-- Share & Retake Actions -->
      <div class="result-actions-panel">
        <button id="btn-share-whatsapp" class="btn btn-whatsapp" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.301-.15-1.78-.879-2.056-.98-.276-.1-.477-.15-.678.15-.201.3-.777.98-.953 1.181-.176.2-.352.226-.653.075s-1.272-.469-2.423-1.496c-.896-.799-1.501-1.785-1.677-2.086-.176-.301-.019-.464.132-.614.135-.135.301-.352.452-.528.15-.176.201-.301.301-.502.101-.201.05-.377-.025-.528s-.678-1.634-.929-2.237c-.244-.587-.493-.507-.678-.516-.176-.009-.377-.01-.577-.01s-.528.075-.804.377c-.276.301-1.055 1.03-1.055 2.513s1.08 2.915 1.231 3.116c.15.201 2.125 3.245 5.148 4.551.719.311 1.281.497 1.719.636.723.23 1.381.197 1.901.12.579-.087 1.78-.728 2.031-1.431.251-.703.251-1.306.176-1.431-.075-.125-.276-.201-.577-.352zM12.04 2c-5.523 0-10 4.477-10 10 0 1.769.46 3.486 1.334 5.006l-1.374 5.016 5.143-1.349c1.472.802 3.136 1.232 4.897 1.232 5.523 0 10-4.477 10-10s-4.477-10-10-10z"/></svg>
          <span id="btn-whatsapp-text">Compartilhar no WhatsApp</span>
        </button>

        <button id="btn-copy-link" class="btn btn-secondary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span id="btn-copy-text">Copiar Link</span>
        </button>

        <button id="btn-restart-quiz" class="btn btn-ghost" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          <span id="btn-restart-text">Refazer Teste</span>
        </button>
      </div>

      <div id="copy-feedback" class="copy-feedback" style="display: none;" role="status">Link copiado com sucesso!</div>
    </div>
  </div>
</article>

<script>
  window.QUIZ_BASE_URL = {{ page.url | relative_url | jsonify }};
</script>
<script src="{{ '/assets/js/quiz-engine.js' | relative_url }}?v=3.2.{{ site.time | date: '%s' }}"></script>

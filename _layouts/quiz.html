---
layout: default
---

<article class="quiz-article container">
  <!-- Quiz Header -->
  <header class="quiz-header">
    <div class="quiz-cover-wrapper" id="quiz-cover-wrapper" style="display: none;">
      <img src="" alt="Quiz Banner" class="quiz-cover-img" id="quiz-cover-img">
    </div>

    <!-- Tags List -->
    <div class="quiz-tags-wrapper" id="quiz-tags-wrapper"></div>

    <div class="quiz-meta-badge" id="quiz-category">Quiz</div>
    <h1 class="quiz-title" id="quiz-title">Loading...</h1>
    <p class="quiz-subtitle" id="quiz-subtitle"></p>
    
    <div class="quiz-info-bar">
      <span id="quiz-time-badge">⏱️ Loading...</span>
      <span id="quiz-count-badge">📊 Loading...</span>
      <span>🌐 Multilingual</span>
    </div>

    <!-- Language Notice (if quiz not available in selected lang) -->
    <div id="quiz-lang-notice" class="quiz-lang-notice" style="display: none;"></div>
  </header>

  <!-- Quiz Interactive Stage -->
  <div id="quiz-stage" class="quiz-stage">
    <!-- Progress Bar -->
    <div class="quiz-progress-wrapper">
      <div class="quiz-progress-info">
        <span id="quiz-progress-text"></span>
        <span id="quiz-progress-percent">0%</span>
      </div>
      <div class="quiz-progress-bar">
        <div id="quiz-progress-fill" class="quiz-progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Active Question Card -->
    <div id="quiz-question-card" class="quiz-question-card">
      <div id="quiz-question-img-wrapper" class="quiz-question-img-wrapper" style="display: none;">
        <img id="quiz-question-img" src="" alt="Question visual" class="quiz-question-img">
      </div>
      <h2 id="quiz-question-title" class="question-title"></h2>
      <div id="quiz-options-list" class="options-container"></div>
    </div>

    <!-- Quiz Result Screen (Initially Hidden) -->
    <div id="quiz-result-card" class="quiz-result-card" style="display: none;">
      <div class="result-celebration" id="result-celebration">🎉 Resultado Revelado!</div>
      
      <div id="result-img-wrapper" class="result-img-wrapper" style="display: none;">
        <img id="result-img" src="" alt="Result" class="result-img">
      </div>
      <div id="result-badge" class="result-badge">🌊</div>
      
      <h2 id="result-title" class="result-title"></h2>
      <p id="result-description" class="result-description"></p>

      <!-- Share Actions -->
      <div class="result-share-actions">
        <button id="btn-share-whatsapp" class="btn btn-whatsapp" type="button">
          <span>📲 WhatsApp</span>
        </button>
        <button id="btn-copy-link" class="btn btn-copy" type="button">
          <span id="btn-copy-text">📋 Copiar Link</span>
        </button>
        <button id="btn-restart-quiz" class="btn btn-outline" type="button">
          <span id="btn-restart-text">🔄 Refazer Teste</span>
        </button>
      </div>
      <div id="copy-feedback" class="copy-feedback" style="display: none;">Link copiado com sucesso!</div>
    </div>
  </div>
</article>

<script>
  window.QUIZ_BASE_URL = {{ page.url | relative_url | jsonify }};
</script>
<script src="{{ '/assets/js/quiz-engine.js' | relative_url }}"></script>

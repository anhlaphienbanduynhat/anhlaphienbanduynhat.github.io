<header class="site-header">
  <div class="container header-inner">
    <a href="{{ '/' | relative_url }}" class="brand-logo">
      <span class="logo-icon">🌊</span>
      <span class="logo-text">Quiztide</span>
    </a>

    <!-- Language Selector Pills -->
    <div class="lang-selector" aria-label="Language selector">
      <button type="button" class="lang-btn" data-lang="pt" onclick="window.setLanguage('pt')">PT</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="window.setLanguage('en')">EN</button>
      <button type="button" class="lang-btn" data-lang="es" onclick="window.setLanguage('es')">ES</button>
    </div>

    <nav class="main-nav">
      <a href="{{ '/' | relative_url }}" id="nav-link-home">Home</a>
      <a href="{{ '/about/' | relative_url }}" id="nav-link-about">About</a>
    </nav>
  </div>
</header>

<header class="navbar">
  <div class="nav-container">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="Quiztide Home">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12c.6 0 1.2-.4 1.5-1 1.2-2.3 3.3-3.7 5.8-3.7 2.4 0 4.5 1.3 5.7 3.5.4.7 1.1 1.2 1.9 1.2h.1c.9 0 1.7-.5 2.1-1.3C19.8 9.3 20.8 8.7 22 8.7"></path>
          <path d="M2 17c.6 0 1.2-.4 1.5-1 1.2-2.3 3.3-3.7 5.8-3.7 2.4 0 4.5 1.3 5.7 3.5.4.7 1.1 1.2 1.9 1.2h.1c.9 0 1.7-.5 2.1-1.3C19.8 14.3 20.8 13.7 22 13.7"></path>
        </svg>
      </div>
      <span class="brand-title">Quiztide</span>
    </a>

    <div class="nav-actions">
      <nav class="nav-links" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" id="nav-link-home" class="nav-item">Avaliações</a>
        <a href="{{ '/about/' | relative_url }}" id="nav-link-about" class="nav-item">Sobre</a>
      </nav>

      <!-- Language Dropdown with Real Flag Images -->
      <details class="lang-dropdown" id="lang-dropdown">
        <summary class="lang-dropdown-trigger" aria-label="Selecionar idioma">
          <img src="{{ '/assets/images/flags/br.svg' | relative_url }}" alt="Português" class="current-flag-img" id="current-flag-img" width="20" height="15">
          <span class="current-lang-name" id="current-lang-name">Português</span>
          <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </summary>

        <div class="lang-dropdown-menu" role="menu">
          <button type="button" class="lang-option-item" onclick="window.setLanguage('pt')">
            <img src="{{ '/assets/images/flags/br.svg' | relative_url }}" alt="Português" width="20" height="15" class="menu-flag-img">
            <span class="lang-label">Português</span>
          </button>
          <button type="button" class="lang-option-item" onclick="window.setLanguage('en')">
            <img src="{{ '/assets/images/flags/us.svg' | relative_url }}" alt="English" width="20" height="15" class="menu-flag-img">
            <span class="lang-label">English</span>
          </button>
          <button type="button" class="lang-option-item" onclick="window.setLanguage('es')">
            <img src="{{ '/assets/images/flags/es.svg' | relative_url }}" alt="Español" width="20" height="15" class="menu-flag-img">
            <span class="lang-label">Español</span>
          </button>
        </div>
      </details>
    </div>
  </div>
</header>

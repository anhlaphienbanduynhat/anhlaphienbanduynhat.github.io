<header class="site-header">
  <div class="header-inner">
    <div class="header-brand-group">
      <a href="{{ '/' | relative_url }}" class="brand-logo" aria-label="Quiztide Home">
        <div class="logo-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12c.6 0 1.2-.4 1.5-1 1.2-2.3 3.3-3.7 5.8-3.7 2.4 0 4.5 1.3 5.7 3.5.4.7 1.1 1.2 1.9 1.2h.1c.9 0 1.7-.5 2.1-1.3C19.8 9.3 20.8 8.7 22 8.7"></path>
            <path d="M2 17c.6 0 1.2-.4 1.5-1 1.2-2.3 3.3-3.7 5.8-3.7 2.4 0 4.5 1.3 5.7 3.5.4.7 1.1 1.2 1.9 1.2h.1c.9 0 1.7-.5 2.1-1.3C19.8 14.3 20.8 13.7 22 13.7"></path>
          </svg>
        </div>
        <span class="logo-text">Quiztide</span>
      </a>
      <span class="header-version-pill">v2.0</span>
    </div>

    <div class="header-actions">
      <!-- Segmented Language Control -->
      <div class="lang-selector" role="radiogroup" aria-label="Language selection">
        <button type="button" class="lang-btn" data-lang="pt" onclick="window.setLanguage('pt')">PT</button>
        <button type="button" class="lang-btn" data-lang="en" onclick="window.setLanguage('en')">EN</button>
        <button type="button" class="lang-btn" data-lang="es" onclick="window.setLanguage('es')">ES</button>
      </div>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" id="nav-link-home" class="nav-item">Testes</a>
        <a href="{{ '/about/' | relative_url }}" id="nav-link-about" class="nav-item">Sobre</a>
      </nav>
    </div>
  </div>
</header>

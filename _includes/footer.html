{% assign current_lang = "pt" %}
{% assign t = site.data.i18n[current_lang] %}

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <div class="footer-logo">🌊 Quiztide</div>
      <p class="footer-desc" id="footer-desc">{{ t.site_tagline }}</p>
    </div>
    <div class="footer-links">
      <h4 id="footer-nav-heading">Navigation</h4>
      <ul>
        <li><a href="{{ '/' | relative_url }}" id="footer-nav-home">{{ t.nav_home }}</a></li>
        <li><a href="{{ '/about/' | relative_url }}" id="footer-nav-about">{{ t.nav_about }}</a></li>
        <li><a href="{{ '/contact/' | relative_url }}" id="footer-nav-contact">Contact</a></li>
      </ul>
    </div>
    <div class="footer-links">
      <h4 id="footer-legal-heading">Legal</h4>
      <ul>
        <li><a href="{{ '/privacy/' | relative_url }}" id="footer-nav-privacy">{{ t.nav_privacy }}</a></li>
        <li><a href="{{ '/terms/' | relative_url }}" id="footer-nav-terms">Terms of Service</a></li>
      </ul>
    </div>
  </div>
  <div class="container footer-bottom">
    <p>&copy; {{ 'now' | date: "%Y" }} Quiztide. All rights reserved.</p>
  </div>
</footer>

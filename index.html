---
layout: default
title: "Home"
---

<!-- Hero Section -->
<div class="hero-section container">
  <span class="hero-badge">🌊 Quiztide</span>
  <h1 class="hero-title" id="home-hero-title"></h1>
  <p class="hero-subtitle" id="home-hero-subtitle"></p>

  <!-- Live Search Box -->
  <div class="search-box-wrapper">
    <input type="text" id="quiz-search-input" placeholder="🔍" class="search-input" aria-label="Search quizzes">
  </div>

  <!-- Dynamic Localized Tag Filter Bar -->
  <div class="tag-filter-bar" id="tag-filter-bar" role="toolbar" aria-label="Tag filters"></div>
</div>

<!-- Quizzes Grid -->
<section class="container" aria-label="Quiz catalog">
  <div class="quiz-grid" id="quiz-catalog-grid">
    <div class="catalog-loading" id="catalog-loading">Carregando quizzes...</div>
  </div>

  <div id="no-results-msg" class="no-results-msg" style="display: none;">
    <p id="no-results-text">Nenhum quiz disponível neste idioma.</p>
  </div>
</section>

<!-- Inject All Quiz Directory URLs -->
<script>
  window.QUIZ_FOLDERS = [
    {% assign quiz_pages = site.pages | where: "layout", "quiz" %}
    {% for q in quiz_pages %}
      "{{ q.url | relative_url }}"{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
</script>

<script>
  (function() {
    'use strict';

    var searchInput = document.getElementById('quiz-search-input');
    var tagFilterBar = document.getElementById('tag-filter-bar');
    var catalogGrid = document.getElementById('quiz-catalog-grid');
    var noResults = document.getElementById('no-results-msg');
    var noResultsText = document.getElementById('no-results-text');
    var heroTitle = document.getElementById('home-hero-title');
    var heroSubtitle = document.getElementById('home-hero-subtitle');

    var currentLang = window.CURRENT_LANG || 'pt';
    var activeTag = 'all';
    var loadedQuizzes = [];

    function calculateEstMinutes(questionCount) {
      if (questionCount <= 3) return 1;
      if (questionCount <= 7) return 2;
      if (questionCount <= 12) return 3;
      return Math.ceil(questionCount * 0.35);
    }

    function getUI() {
      var i18n = window.SITE_I18N || {};
      return i18n[currentLang] || i18n.pt || {};
    }

    // Load available quizzes for the selected language
    function loadCatalog(lang) {
      currentLang = lang;
      var ui = getUI();

      if (heroTitle) heroTitle.textContent = ui.hero_title || '';
      if (heroSubtitle) heroSubtitle.textContent = ui.hero_subtitle || '';
      if (searchInput) searchInput.placeholder = ui.search_placeholder || '🔍';
      if (noResultsText) noResultsText.textContent = ui.no_results || 'Nenhum quiz disponível neste idioma.';

      var folders = window.QUIZ_FOLDERS || [];
      if (folders.length === 0) {
        catalogGrid.innerHTML = '';
        if (noResults) noResults.style.display = 'block';
        return;
      }

      var fetchPromises = folders.map(function(rawUrl) {
        var url = rawUrl;
        if (url.charAt(url.length - 1) !== '/') url += '/';

        return fetch(url + 'locales/' + lang + '.json')
          .then(function(res) {
            if (!res.ok) return null;
            return res.json().then(function(data) {
              var qCount = (data.questions || []).length;
              var estMinutes = calculateEstMinutes(qCount);
              return {
                url: url,
                title: data.title,
                subtitle: data.subtitle,
                category: data.category,
                tags: data.tags || [],
                cover: data.cover ? (url + data.cover) : null,
                questionCount: qCount,
                estMinutes: estMinutes
              };
            });
          })
          .catch(function() {
            return null;
          });
      });

      Promise.all(fetchPromises).then(function(results) {
        loadedQuizzes = results.filter(function(q) { return q !== null; });
        activeTag = 'all';
        renderTagFilterBar();
        renderCards();
      });
    }

    function renderTagFilterBar() {
      var ui = getUI();
      var tagSet = {};
      loadedQuizzes.forEach(function(q) {
        (q.tags || []).forEach(function(t) {
          tagSet[t] = true;
        });
      });

      var tags = Object.keys(tagSet);
      tagFilterBar.innerHTML = '';

      var allBtn = document.createElement('button');
      allBtn.type = 'button';
      allBtn.className = 'tag-filter-btn' + (activeTag === 'all' ? ' active' : '');
      allBtn.textContent = '✨ ' + (ui.all_tags || 'Todos');
      allBtn.addEventListener('click', function() {
        document.querySelectorAll('.tag-filter-btn').forEach(function(b) { b.classList.remove('active'); });
        allBtn.classList.add('active');
        activeTag = 'all';
        renderCards();
      });
      tagFilterBar.appendChild(allBtn);

      tags.forEach(function(tag) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tag-filter-btn' + (activeTag === tag ? ' active' : '');
        btn.textContent = '#' + tag;
        btn.addEventListener('click', function() {
          document.querySelectorAll('.tag-filter-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          activeTag = tag;
          renderCards();
        });
        tagFilterBar.appendChild(btn);
      });
    }

    function renderCards() {
      var ui = getUI();
      var query = (searchInput ? searchInput.value : '').toLowerCase().trim();
      var visibleCount = 0;

      catalogGrid.innerHTML = '';

      loadedQuizzes.forEach(function(q) {
        var title = (q.title || '').toLowerCase();
        var subtitle = (q.subtitle || '').toLowerCase();
        var tagsLower = (q.tags || []).map(function(t) { return t.toLowerCase(); });

        var matchesTag = (activeTag === 'all') || tagsLower.indexOf(activeTag.toLowerCase()) !== -1;
        var matchesQuery = !query ||
          title.indexOf(query) !== -1 ||
          subtitle.indexOf(query) !== -1 ||
          tagsLower.some(function(t) { return t.indexOf(query) !== -1; });

        if (matchesTag && matchesQuery) {
          visibleCount++;
          var card = document.createElement('article');
          card.className = 'quiz-card';

          var tagsHtml = (q.tags || []).map(function(t) {
            return '<span class="card-tag">#' + t + '</span>';
          }).join('');

          var coverHtml = '';
          if (q.cover) {
            coverHtml = '<div class="card-cover-wrapper">' +
              '<img src="' + q.cover + '" alt="' + q.title + '" class="card-cover-img" loading="lazy">' +
            '</div>';
          }

          var questionsLabel = ui.questions_label || 'questões';
          var metaStats = '📊 <span class="tabular-nums">' + q.questionCount + '</span> ' + questionsLabel + ' · ⏱️ ~<span class="tabular-nums">' + q.estMinutes + '</span> min';

          card.innerHTML = '<a href="' + q.url + '" class="card-link-wrapper">' +
            coverHtml +
            '<div class="card-body">' +
              '<div class="card-tags">' + tagsHtml + '</div>' +
              '<h3 class="card-title">' + q.title + '</h3>' +
              '<p class="card-desc">' + q.subtitle + '</p>' +
              '<div class="card-footer">' +
                '<span class="card-meta-time">' + metaStats + '</span>' +
                '<span class="card-cta-btn">' + (ui.start_quiz || 'Começar Quiz') + ' &rarr;</span>' +
              '</div>' +
            '</div>' +
          '</a>';

          catalogGrid.appendChild(card);
        }
      });

      if (noResults) {
        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
      }
    }

    if (searchInput) {
      searchInput.addEventListener('input', renderCards);
    }

    window.addEventListener('quiztide:langchange', function(e) {
      loadCatalog(e.detail.lang || 'pt');
    });

    loadCatalog(currentLang);
  })();
</script>

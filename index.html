---
layout: default
title: "Home"
---

<!-- Hero Section -->
<div class="hero-section container">
  <span class="hero-badge">🌊 Quiztide</span>
  <h1 class="hero-title" id="home-hero-title"></h1>
  <p class="hero-subtitle" id="home-hero-subtitle"></p>

  <!-- Live Search Box -->
  <div class="search-box-wrapper">
    <input type="text" id="quiz-search-input" placeholder="🔍" class="search-input">
  </div>

  <!-- Tag Filter Bar -->
  <div class="tag-filter-bar" id="tag-filter-bar">
    <button type="button" class="tag-filter-btn active" data-tag="all" id="btn-tag-all">✨ Todos</button>
    <button type="button" class="tag-filter-btn" data-tag="personalidade">#personalidade</button>
    <button type="button" class="tag-filter-btn" data-tag="psicologia">#psicologia</button>
    <button type="button" class="tag-filter-btn" data-tag="autoconhecimento">#autoconhecimento</button>
  </div>
</div>

<!-- Quizzes Grid -->
<section class="container">
  <div class="quiz-grid" id="quiz-catalog-grid"></div>

  <div id="no-results-msg" class="no-results-msg" style="display: none;">
    <p id="no-results-text">Nenhum quiz encontrado.</p>
  </div>
</section>

<!-- Inject Quizzes Data for Reactive Catalog -->
<script>
  window.QUIZZES_CATALOG = [
    {% assign quiz_pages = site.pages | where: "layout", "quiz" %}
    {% for q in quiz_pages %}
    {
      url: {{ q.url | relative_url | jsonify }},
      slug: {{ q.slug | jsonify }},
      cover_image: {{ q.cover_image | relative_url | jsonify }},
      tags: {{ q.tags | jsonify }},
      title: {{ q.title | jsonify }},
      subtitle: {{ q.subtitle | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
</script>

<script>
  (function() {
    'use strict';

    var searchInput = document.getElementById('quiz-search-input');
    var tagButtons = document.querySelectorAll('.tag-filter-btn');
    var catalogGrid = document.getElementById('quiz-catalog-grid');
    var noResults = document.getElementById('no-results-msg');
    var noResultsText = document.getElementById('no-results-text');
    var heroTitle = document.getElementById('home-hero-title');
    var heroSubtitle = document.getElementById('home-hero-subtitle');
    var btnTagAll = document.getElementById('btn-tag-all');

    var currentLang = window.CURRENT_LANG || 'pt';
    var activeTag = 'all';

    function getUI() {
      var i18n = window.SITE_I18N || {};
      return i18n[currentLang] || i18n.pt || {};
    }

    function getText(obj) {
      if (!obj) return '';
      if (typeof obj === 'string') return obj;
      return obj[currentLang] || obj.pt || obj.en || obj.es || '';
    }

    function renderView() {
      var ui = getUI();
      if (heroTitle) heroTitle.textContent = ui.hero_title || '';
      if (heroSubtitle) heroSubtitle.textContent = ui.hero_subtitle || '';
      if (searchInput) searchInput.placeholder = ui.search_placeholder || '🔍 Buscar quizzes...';
      if (btnTagAll) btnTagAll.textContent = '✨ ' + (ui.all_tags || 'Todos');
      if (noResultsText) noResultsText.textContent = ui.no_results || 'Nenhum quiz encontrado.';

      renderCards();
    }

    function renderCards() {
      var query = (searchInput ? searchInput.value : '').toLowerCase().trim();
      var ui = getUI();
      var quizzes = window.QUIZZES_CATALOG || [];
      var visibleCount = 0;

      catalogGrid.innerHTML = '';

      quizzes.forEach(function(q) {
        var tags = (q.tags || []).map(function(t) { return t.toLowerCase(); });
        var title = getText(q.title);
        var subtitle = getText(q.subtitle);

        var matchesTag = (activeTag === 'all') || tags.indexOf(activeTag.toLowerCase()) !== -1;
        var matchesQuery = !query || 
          title.toLowerCase().indexOf(query) !== -1 || 
          subtitle.toLowerCase().indexOf(query) !== -1 ||
          tags.some(function(t) { return t.indexOf(query) !== -1; });

        if (matchesTag && matchesQuery) {
          visibleCount++;
          var card = document.createElement('article');
          card.className = 'quiz-card';

          var tagsHtml = (q.tags || []).map(function(t) {
            return '<span class="card-tag">#' + t + '</span>';
          }).join('');

          var coverHtml = '';
          if (q.cover_image) {
            coverHtml = '<div class="card-cover-wrapper">' +
              '<img src="' + q.cover_image + '" alt="' + title + '" class="card-cover-img" loading="lazy">' +
            '</div>';
          }

          card.innerHTML = '<a href="' + q.url + '" class="card-link-wrapper">' +
            coverHtml +
            '<div class="card-body">' +
              '<div class="card-tags">' + tagsHtml + '</div>' +
              '<h3 class="card-title">' + title + '</h3>' +
              '<p class="card-desc">' + subtitle + '</p>' +
              '<div class="card-footer">' +
                '<span class="card-meta-time">⏱️ ' + (ui.read_time || '2 min') + '</span>' +
                '<span class="card-cta-btn">' + (ui.start_quiz || 'Começar Quiz') + ' &rarr;</span>' +
              '</div>' +
            '</div>' +
          '</a>';

          catalogGrid.appendChild(card);
        }
      });

      if (noResults) {
        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
      }
    }

    if (searchInput) {
      searchInput.addEventListener('input', renderCards);
    }

    tagButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        tagButtons.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        activeTag = btn.getAttribute('data-tag');
        renderCards();
      });
    });

    window.addEventListener('quiztide:langchange', function(e) {
      currentLang = e.detail.lang || 'pt';
      renderView();
    });

    // Initial render
    renderView();
  })();
</script>

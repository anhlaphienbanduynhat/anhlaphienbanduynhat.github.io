<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <pattern id="gridEnergy" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#27272A" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#bgEnergy)"/>
  <rect width="600" height="300" fill="url(#gridEnergy)" opacity="0.6"/>

  <!-- Energy Pulse Wave & Resilience Matrix -->
  <g transform="translate(100, 75)">
    <!-- Sleek battery / charge cells frame -->
    <rect x="20" y="20" width="120" height="60" rx="12" fill="#27272A" stroke="#3F3F46" stroke-width="2"/>
    <path d="M142 40 C146 40, 148 44, 148 50 C148 56, 146 60, 142 60" fill="none" stroke="#3F3F46" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Cells -->
    <rect x="30" y="30" width="22" height="40" rx="4" fill="#F4F4F5"/>
    <rect x="58" y="30" width="22" height="40" rx="4" fill="#E4E4E7"/>
    <rect x="86" y="30" width="22" height="40" rx="4" fill="#A1A1AA"/>
    <rect x="114" y="30" width="16" height="40" rx="4" fill="#52525B" opacity="0.5"/>

    <!-- Pulse Wave Line -->
    <g transform="translate(180, 20)">
      <rect width="200" height="60" rx="12" fill="#27272A" stroke="#3F3F46" stroke-width="2"/>
      <path d="M15 30 L55 30 L70 12 L85 48 L100 24 L115 36 L125 30 L185 30" fill="none" stroke="#F4F4F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="85" cy="48" r="3" fill="#A1A1AA"/>
      <circle cx="100" cy="24" r="3" fill="#F4F4F5"/>
    </g>

    <!-- Subtle Rhythm Indicators -->
    <g transform="translate(40, 110)">
      <line x1="0" y1="0" x2="320" y2="0" stroke="#3F3F46" stroke-width="1.5"/>
      <circle cx="40" cy="0" r="4" fill="#F4F4F5"/>
      <circle cx="120" cy="0" r="4" fill="#A1A1AA"/>
      <circle cx="200" cy="0" r="4" fill="#71717A"/>
      <circle cx="280" cy="0" r="4" fill="#52525B"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#dsGrad)"/>
  <circle cx="700" cy="80" r="180" fill="#60A5FA" opacity="0.3"/>
  <circle cx="100" cy="380" r="140" fill="#1E40AF" opacity="0.4"/>
  
  <g transform="translate(180, 80)">
    <!-- Scale / Compass graphic -->
    <circle cx="220" cy="110" r="70" fill="url(#cardGrad)" stroke="#93C5FD" stroke-width="3"/>
    <path d="M220 60 L235 110 L220 160 L205 110 Z" fill="#FBBF24"/>
    <circle cx="220" cy="110" r="10" fill="#FFFFFF"/>
    
    <!-- Balance elements -->
    <line x1="120" y1="180" x2="320" y2="180" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <rect x="130" y="190" width="60" height="40" rx="8" fill="#FFFFFF" opacity="0.9"/>
    <text x="160" y="215" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">DADOS</text>
    
    <rect x="250" y="190" width="60" height="40" rx="8" fill="#FDE047" opacity="0.95"/>
    <text x="280" y="215" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="bold" fill="#854D0E" text-anchor="middle">INSTINTO</text>
  </g>
  <text x="400" y="380" font-family="-apple-system, Inter, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">ESTILO DE DECISÃO</text>
  <text x="400" y="410" font-family="-apple-system, Inter, sans-serif" font-size="16" font-weight="500" fill="#BFDBFE" text-anchor="middle">Racional • Intuitivo • Colaborativo • Ágil</text>
</svg>

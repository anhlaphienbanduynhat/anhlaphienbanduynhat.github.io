<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDecision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <pattern id="gridDecision" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#27272A" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#bgDecision)"/>
  <rect width="600" height="300" fill="url(#gridDecision)" opacity="0.6"/>

  <!-- Decision Matrix / Path Geometry -->
  <g transform="translate(150, 60)">
    <!-- Main Center Node -->
    <circle cx="150" cy="90" r="28" fill="#27272A" stroke="#3F3F46" stroke-width="2"/>
    <circle cx="150" cy="90" r="10" fill="#F4F4F5"/>

    <!-- Path Lines to 4 styles -->
    <!-- Up-Left: Rational (data nodes) -->
    <path d="M130 75 L60 30" stroke="#71717A" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="60" cy="30" r="20" fill="#27272A" stroke="#52525B" stroke-width="2"/>
    <rect x="52" y="22" width="16" height="16" rx="3" fill="none" stroke="#F4F4F5" stroke-width="2"/>

    <!-- Up-Right: Intuitive (spark/radiant) -->
    <path d="M170 75 L240 30" stroke="#71717A" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="240" cy="30" r="20" fill="#27272A" stroke="#52525B" stroke-width="2"/>
    <polygon points="240,18 244,27 253,30 244,33 240,42 236,33 227,30 236,27" fill="#F4F4F5"/>

    <!-- Down-Left: Collaborative (linked circles) -->
    <path d="M130 105 L60 150" stroke="#71717A" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="60" cy="150" r="20" fill="#27272A" stroke="#52525B" stroke-width="2"/>
    <circle cx="55" cy="150" r="6" fill="none" stroke="#F4F4F5" stroke-width="1.5"/>
    <circle cx="65" cy="150" r="6" fill="none" stroke="#A1A1AA" stroke-width="1.5"/>

    <!-- Down-Right: Action / Agile (forward bolt) -->
    <path d="M170 105 L240 150" stroke="#71717A" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="240" cy="150" r="20" fill="#27272A" stroke="#52525B" stroke-width="2"/>
    <polyline points="236,140 246,150 236,160" fill="none" stroke="#F4F4F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ambient axis indicators -->
  <line x1="80" y1="240" x2="520" y2="240" stroke="#27272A" stroke-width="1"/>
  <circle cx="300" cy="240" r="4" fill="#A1A1AA"/>
</svg>
